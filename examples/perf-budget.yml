# Copy to .github/workflows/perf-budget.yml
name: Perf budget

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# A new push to the PR cancels the run for the previous one.
concurrency:
  group: perf-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perf-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: Gaurav3170/perf-budget-guard@v1
        with:
          config: perf-budget.json
